name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================================
  # JOB 1 — TEST
  # =========================================
  test:
    name: Install, Train and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: |
          cd src
          python generate_data.py
          python train.py

      - name: Run tests
        run: pytest

      - name: Verify model exists
        run: ls models/

  # =========================================
  # JOB 2 — BUILD AND PUSH TO ECR
  # =========================================
  build-and-push:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t fraud-detection:${{ github.sha }} .

      - name: Tag Docker image
        run: |
          docker tag fraud-detection:${{ github.sha }} \
          926028309952.dkr.ecr.ap-south-1.amazonaws.com/fraud-detection:${{ github.sha }}

          docker tag fraud-detection:${{ github.sha }} \
          926028309952.dkr.ecr.ap-south-1.amazonaws.com/fraud-detection:latest

      - name: Push Docker image to ECR
        run: |
          docker push 926028309952.dkr.ecr.ap-south-1.amazonaws.com/fraud-detection:${{ github.sha }}

          docker push 926028309952.dkr.ecr.ap-south-1.amazonaws.com/fraud-detection:latest

  # =========================================
  # JOB 3 — DEPLOY TO EKS
  # =========================================
  deploy:
    name: Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Connect to EKS cluster
        run: |
          aws eks update-kubeconfig \
          --region ap-south-1 \
          --name fraud-detection-cluster

      - name: Update deployment with new image
        run: |
          kubectl set image deployment/fraud-detection \
          fraud-detection=926028309952.dkr.ecr.ap-south-1.amazonaws.com/fraud-detection:${{ github.sha }}

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/fraud-detection --timeout=5m

      - name: Get application service
        run: |
          kubectl get service fraud-detection-service